<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2663eb" />
    <title>Hors ligne — SoftFacture Afrique</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #eff4f9;
        color: #1b1b1b;
        text-align: center;
        padding: 1.5rem;
      }
      .box {
        max-width: 24rem;
      }
      .logo {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: #2663eb;
        color: #fff;
        font-weight: 800;
        font-size: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.65rem 1.25rem;
        border-radius: 0.5rem;
        background: #2663eb;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.875rem;
      }
      p {
        color: #64748b;
        font-size: 0.9rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo">SF</div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        SoftFacture Afrique n’est pas accessible sans connexion. Vérifiez votre réseau puis
        réessayez.
      </p>
      <a href="/">Réessayer</a>
    </div>
  </body>
</html>
