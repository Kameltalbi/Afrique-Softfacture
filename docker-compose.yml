services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # 5433 pour éviter le conflit avec d'autres Postgres locaux (souvent déjà sur 5432)
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: softfacture
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
